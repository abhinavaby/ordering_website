<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details – FeastHub</title>
  <meta name="description" content="View full details, ingredients, and pricing for this premium dish on FeastHub." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="detail-page">

  <!-- ===== CART SIDEBAR ===== -->
  <div id="cart-overlay" class="cart-overlay hidden" aria-hidden="true"></div>
  <aside id="cart-sidebar" class="cart-sidebar" role="complementary" aria-label="Shopping cart">
    <div class="cart-header">
      <div class="cart-header-title">
        <span class="cart-icon-header">🛒</span>
        <h2>Your Order</h2>
      </div>
      <button id="cart-close-btn" class="cart-close-btn" aria-label="Close cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="cart-items-list" class="cart-items-list"></div>
    <div id="cart-empty" class="cart-empty hidden">
      <span class="cart-empty-icon">🍽️</span>
      <p>Your cart is empty</p>
      <span>Add some delicious items from the menu!</span>
    </div>
    <div id="cart-footer" class="cart-footer hidden">
      <div class="cart-summary">
        <div class="cart-summary-row">
          <span>Subtotal</span>
          <span id="cart-subtotal">$0.00</span>
        </div>
        <div class="cart-summary-row">
          <span>Delivery Fee</span>
          <span id="cart-delivery">$2.99</span>
        </div>
        <div class="cart-summary-row cart-total-row">
          <span>Total</span>
          <span id="cart-total">$0.00</span>
        </div>
      </div>
      <button id="checkout-btn" class="btn-primary btn-checkout">
        <span id="checkout-btn-text">Place Order via Email 📧</span>
        <span id="checkout-spinner" class="btn-spinner hidden"></span>
      </button>
      <p id="checkout-status" class="form-status hidden"></p>
    </div>
  </aside>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="nav-brand">
      <a href="index.html" class="back-link" id="back-btn" aria-label="Back to menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </a>
    </div>
    <div class="nav-brand center-brand">
      <span class="logo-icon">🍽️</span>
      <span class="nav-logo-text">FeastHub</span>
    </div>
    <div class="navbar-right">
      <button id="cart-toggle-btn" class="cart-toggle-btn" aria-label="Open cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span id="cart-badge" class="cart-badge hidden">0</span>
      </button>
      <div class="nav-user">
        <span class="user-avatar" id="user-avatar-letter">U</span>
        <span id="nav-user-name">Guest</span>
      </div>
    </div>
  </nav>

  <!-- PRODUCT DETAIL CONTENT -->
  <main class="detail-main" id="detail-main">

    <!-- Skeleton -->
    <div id="detail-skeleton" class="detail-skeleton">
      <div class="skeleton skeleton-detail-img"></div>
      <div class="detail-info-skeleton">
        <div class="skeleton skeleton-title"></div>
        <div class="skeleton skeleton-badge"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-line short"></div>
        <div class="skeleton skeleton-line"></div>
        <div class="skeleton skeleton-price"></div>
        <div class="skeleton skeleton-btn"></div>
      </div>
    </div>

    <!-- Real Content -->
    <div id="detail-content" class="detail-content hidden">
      <div class="detail-img-wrap">
        <div class="detail-img-container" id="detail-img-container">
          <img id="detail-img" src="" alt="" class="detail-img" />
          <div class="detail-badge" id="detail-badge">⭐ Popular</div>
        </div>
        <div class="detail-img-bg" id="detail-img-bg"></div>
      </div>

      <div class="detail-info">
        <div class="detail-category" id="detail-category">Main Course</div>
        <h1 class="detail-title" id="detail-title">Product Name</h1>

        <div class="detail-meta">
          <span class="meta-chip" id="meta-time">⏱ 20 mins</span>
          <span class="meta-chip" id="meta-calories">🔥 450 kcal</span>
          <span class="meta-chip" id="meta-rating">⭐ 4.8</span>
        </div>

        <p class="detail-description" id="detail-description">Loading...</p>

        <div class="detail-ingredients">
          <h3>Ingredients</h3>
          <ul id="detail-ingredients-list" class="ingredients-list"></ul>
        </div>

        <div class="detail-footer">
          <div class="detail-price-block">
            <span class="price-label">Price</span>
            <span class="detail-price" id="detail-price">$0.00</span>
          </div>
          <div class="qty-block">
            <button class="qty-btn" id="qty-decrease" aria-label="Decrease quantity">−</button>
            <span class="qty-display" id="qty-display">1</span>
            <button class="qty-btn" id="qty-increase" aria-label="Increase quantity">+</button>
          </div>
          <button class="btn-primary btn-order" id="order-btn">
            Add to Cart 🛒
          </button>
        </div>

        <!-- Toast -->
        <div class="order-toast hidden" id="order-toast">
          <span>✅ Added to cart!</span>
        </div>
      </div>
    </div>

  </main>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="env.js"></script>
  <script src="cart.js"></script>
  <script src="product.js"></script>
</body>
</html>
